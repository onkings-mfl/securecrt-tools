[Global]
output_dir = ScriptOutput
date_format = %Y-%m-%d-%H-%M-%S
modify_term = True
debug_mode = False
use_proxy = False
proxy_session =
response_timeout = 10

[add_global_config]
show_instructions = True
ios =
nxos =
asa =
ios-xr =


[cdp_to_csv]
strip_domains = cisco.com, presidio.com

[cisco_packet_capture]
default_runtime_seconds = 30
min_runtime_seconds = 5
max_runtime_seconds = 300
default_buffer_size_mb = 25
min_buffer_size_mb = 1
max_buffer_size_mb = 100
warn_on_risky_interface = True
cleanup_capture_on_exit = True
prompt_delete_local_pcap = True
delete_local_pcap_after_remote_copy = False

[create_sessions_from_cdp]
folder = _imports
strip_domains = cisco.com, presidio.com

[document_device]
show_instructions = True
folder_per_device = True
prompt_for_custom_lists = False
ios = show ver, show int status, show run, show standby brief
nxos = show ver, show int status, show run, show hsrp brief
asa = show ver, show run
ios-xr = show ver, show run

[update_interface_desc]
strip_domains = cisco.com, presidio.com
take_backups = True
rollback_file = True

[update_dhcp_relay]
show_instructions = True
old_relays = 172.16.1.1, 172.16.2.1
new_relays = 10.1.1.1, 10.2.2.1
remove_old_relays = False
